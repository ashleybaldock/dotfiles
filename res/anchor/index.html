<html lang="en">
  <head>
    <title>Anchor</title>

  </head>
  <body>
    <h1>Anchor</h1>

    <section class="compass">
      <div class="anchor">⚓︎1</div>
      <div class="point s">s</div>
      <div class="point ssw">ssw</div>
      <div class="point sw">sw</div>
      <div class="point wsw">wsw</div>
      <div class="point w">w</div>
      <div class="point wnw">wnw</div>
      <div class="point nw">nw</div>
      <div class="point nnw">nnw</div>
      <div class="point n">n</div>
      <div class="point nne">nne</div>
      <div class="point ne">ne</div>
      <div class="point ene">ene</div>
      <div class="point e">e</div>
      <div class="point ese">ese</div>
      <div class="point se">se</div>
      <div class="point sse">sse</div>

      <div class="point s">s</div>
      <div class="point ssw">ssw</div>
      <div class="point sw">sw</div>
      <div class="point wsw">wsw</div>
      <div class="point w">w</div>

      <div class="point nw">nw</div>
      <div class="point nnw">nnw</div>
      <div class="point n">n</div>
      <div class="point nne">nne</div>
      <div class="point ne">ne</div>
      <div class="point ene">ene</div>
      <div class="point e">e</div>
      <div class="point ese">ese</div>
      <div class="point se">se</div>
      <div class="point sse">sse</div>
    </section>
    <section class="toggle">
      <div class="anchor">⚓︎2</div>
      <fieldset name="tgl">
        <legend>Toggle</legend>
        <label>
          <span>0</span>
          <input type="radio" id="tgl0" name="tgl" value="" />
        </label>
        <label>
          <span>1</span>
          <input type="radio" id="tgl1" name="tgl" value="" />
        </label>
        <label>
          <span>2</span>
          <input type="radio" id="tgl2" name="tgl" value="" />
        </label>
        <label>
          <span>3</span>
          <input type="radio" id="tgl3" name="tgl" value="" />
        </label>
        <label>
          <span>4</span>
          <input type="radio" id="tgl4" name="tgl" value="" />
        </label>
        <label>
          <span>5</span>
          <input type="radio" id="tgl5" name="tgl" value="" />
        </label>
        <label>
          <span>6</span>

        </label>
        <label>
          <span>7</span>
          <input type="radio" id="tgl7" name="tgl" value="" />
        </label>
      </fieldset>
    </section>
  </body>
